name: Scheduled Price & Article Posts

# فقط یک اجرا در هر لحظه مجازه؛ اگه اجرای جدیدی شروع بشه در حالی که یکی
# دیگه هنوز در حال کاره، صبر می‌کنه تا اون تموم بشه (نه اینکه هم‌زمان
# اجرا بشن و باعث تداخل موقع push کردن state.json بشن).
concurrency:
  group: post-to-telegram
  cancel-in-progress: false

on:
  schedule:
    # هر اجرا در دقیقه 30، ساعات UTC معادل 9، 11، 13، 15، 17، 19، 21 به وقت تهران
    # تهران = UTC+3:30 (بدون تغییر ساعت تابستانی)
    - cron: "30 5 * * *"   # 09:00 تهران -> قیمت (6 پست جدا)
    - cron: "30 7 * * *"   # 11:00 تهران -> مقاله
    - cron: "30 9 * * *"   # 13:00 تهران -> مقاله
    - cron: "30 11 * * *"  # 15:00 تهران -> قیمت (5 پست جدا)
    - cron: "30 13 * * *"  # 17:00 تهران -> مقاله
    - cron: "30 15 * * *"  # 19:00 تهران -> قیمت (5 پست جدا)
    - cron: "30 17 * * *"  # 21:00 تهران -> مقاله
  workflow_dispatch:
    inputs:
      force_slot:
        description: "نوع پست برای اجرای دستی (price / article / all)"
        required: false
        default: ""
      test_articles_count:
        description: "فقط برای force_slot=article یا all: چند مقاله پست بشه"
        required: false
        default: ""

permissions:
  contents: write   # برای commit کردن state.json (حافظه مقالات پست‌شده)

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SLOT: ${{ github.event.inputs.force_slot }}
          TEST_ARTICLES_COUNT: ${{ github.event.inputs.test_articles_count }}
        run: python main.py

      - name: Commit updated state (posted articles memory)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --soft origin/main
            git add state.json

            if git diff --cached --quiet; then
              echo "state.json تغییری نکرده؛ نیازی به commit نیست."
              break
            fi

            git commit -m "chore: update posted-articles state [skip ci]"

            if git push origin HEAD:main; then
              echo "push موفق بود (تلاش $attempt)."
              break
            fi

            echo "push رد شد (تلاش $attempt)، چند ثانیه صبر و تلاش دوباره..."
            sleep 5
          done
